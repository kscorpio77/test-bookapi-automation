name: Testbook API Automation Tests

on:

  # Run when automation framework itself changes
  push:
    branches:
      - main

  # Allow manual execution
  workflow_dispatch:

  # Allow application repository to trigger this workflow
  repository_dispatch:
    types:
      - book-api-build-success


jobs:

  api-tests:

    name: Run API Automation Tests

    runs-on: ubuntu-latest

    env:
      BASE_URL: http://localhost:8080


    steps:

      # ======================================================
      # STEP 1 - GET AUTOMATION CODE
      # ======================================================
      #
      # Download the RestAssured automation framework.
      # ======================================================

      - name: Checkout Automation Repository
        uses: actions/checkout@v4


      # ======================================================
      # STEP 2 - INSTALL JAVA
      # ======================================================

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven


      # ======================================================
      # STEP 3 - GET BOOK API SOURCE CODE
      # ======================================================
      #
      # The automation runner is a completely new computer.
      #
      # Therefore, it doesn't have the Book API application.
      #
      # We download the application repository into a folder
      # called "book-api".
      # ======================================================

      - name: Checkout Book API
        uses: actions/checkout@v4
        with:
          repository: kscorpio77/testbookapiworkflowdemo
          ref: main
          path: book-api


      # ======================================================
      # STEP 4 - BUILD BOOK API DOCKER IMAGE
      # ======================================================
      #
      # Build a Docker image from the Book API Dockerfile.
      #
      # GitHub's Ubuntu runner already provides Docker.
      # ======================================================

      - name: Build Book API Docker Image
        run: |
          echo "Building Testbook API Docker image..."

          docker build \
            -t testbook-api:latest \
            ./book-api


      # ======================================================
      # STEP 5 - START BOOK API
      # ======================================================
      #
      # Start the application in the background.
      #
      # Port 8080 inside Docker is connected to port 8080
      # on the GitHub runner.
      #
      # Therefore RestAssured can use:
      #
      # http://localhost:8080
      # ======================================================

      - name: Start Book API
        run: |
          echo "Starting Testbook API..."

          docker run -d \
            --name bookapi \
            -p 8080:8080 \
            testbook-api:latest


      # ======================================================
      # STEP 6 - WAIT FOR APPLICATION
      # ======================================================
      #
      # Starting Docker does not mean Spring Boot is
      # immediately ready.
      #
      # We repeatedly call /api/books until it responds.
      # ======================================================

      - name: Wait for Book API
        run: |

          echo "Waiting for Testbook API..."

          for i in {1..30}
          do

            if curl --fail --silent \
              http://localhost:8080/api/books \
              > /dev/null
            then

              echo ""
              echo "Testbook API is ready!"
              exit 0

            fi

            echo "Waiting... attempt $i/30"

            sleep 2

          done

          echo ""
          echo "ERROR: Testbook API failed to start."
          echo ""

          docker logs bookapi

          exit 1


      # ======================================================
      # STEP 7 - RUN AUTOMATION TESTS
      # ======================================================
      #
      # Now we KNOW that the Book API is running.
      #
      # RestAssured tests can safely call localhost:8080.
      # ======================================================

      - name: Run RestAssured Automation Tests
        run: |

          echo "=========================================="
          echo "Running API Automation Tests"
          echo "=========================================="

          echo "Target application:"
          echo "${BASE_URL}"

          mvn --batch-mode clean test \
            -Dbase.url="${BASE_URL}"


      # ======================================================
      # STEP 8 - SHOW LOGS IF SOMETHING FAILS
      # ======================================================
      #
      # If the tests fail, application logs can help us
      # understand what happened.
      # ======================================================

      - name: Show Book API Logs on Failure
        if: failure()
        run: |
          echo "Book API logs:"
          docker logs bookapi || true


      # ======================================================
      # STEP 9 - CLEAN UP
      # ======================================================
      #
      # Always remove the application container when finished.
      #
      # "if: always()" means this step runs even when the
      # automation tests fail.
      # ======================================================

      - name: Stop Book API
        if: always()
        run: |
          docker stop bookapi || true
          docker rm bookapi || true