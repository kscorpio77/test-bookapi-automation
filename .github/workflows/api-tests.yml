name: Testbook API tests

on:
  push:
  workflow_dispatch:
    inputs:
      base_url:
        description: Base URL of the already-running Testbook API
        required: false
        default: http://localhost:8080
        type: string

jobs:
  api-tests:
    runs-on: ubuntu-latest
    env:
      BASE_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.base_url || vars.API_BASE_URL || 'http://localhost:8080' }}
    steps:
      - name: Check out automation repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run API tests
        run: mvn --batch-mode clean test -Dbase.url="${BASE_URL}"
