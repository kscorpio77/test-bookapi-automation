name: Testbook API Automation Tests

# ============================================================
# WORKFLOW TRIGGERS
# ============================================================

on:

  # Run automation when automation code itself changes
  push:
    branches:
      - main

  # Allow manual execution from GitHub Actions
  workflow_dispatch:

  # Run when successfully triggered by the application repo
  repository_dispatch:
    types:
      - book-api-build-success


# ============================================================
# JOB
# ============================================================

jobs:

  api-tests:

    name: Run API Automation Tests

    runs-on: ubuntu-latest

    env:
      BASE_URL: http://localhost:8080


    steps:

      # ======================================================
      # STEP 1 - CHECKOUT AUTOMATION REPOSITORY
      # ======================================================

      - name: Checkout Automation Repository
        uses: actions/checkout@v4


      # ======================================================
      # STEP 2 - SET UP JAVA
      # ======================================================

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven


      # ======================================================
      # STEP 3 - CHECKOUT APPLICATION REPOSITORY
      # ======================================================
      #
      # The automation workflow runs on its own GitHub runner.
      #
      # Therefore we also need the application source code
      # so that we can start the application locally.
      #
      # The application will be downloaded into:
      #
      #     book-api/
      #
      # ======================================================

      - name: Checkout Book API
        uses: actions/checkout@v4
        with:
          repository: kscorpio77/testbookapiworkflowdemo
          ref: main
          path: book-api


      # ======================================================
      # STEP 4 - BUILD APPLICATION DOCKER IMAGE
      # ======================================================

      - name: Build Book API Docker Image
        run: |
          echo "=========================================="
          echo "Building Book API Docker Image"
          echo "=========================================="

          docker build \
            -t testbook-api:latest \
            ./book-api


      # ======================================================
      # STEP 5 - START APPLICATION
      # ======================================================

      - name: Start Book API
        run: |
          echo "=========================================="
          echo "Starting Book API"
          echo "=========================================="

          docker run -d \
            --name bookapi \
            -p 8080:8080 \
            testbook-api:latest


      # ======================================================
      # STEP 6 - WAIT UNTIL APPLICATION IS READY
      # ======================================================

      - name: Wait for Book API
        run: |

          echo "Waiting for Book API..."

          for i in {1..30}
          do

            if curl --fail --silent \
              http://localhost:8080/api/books \
              > /dev/null
            then

              echo ""
              echo "Book API is ready."
              exit 0

            fi

            echo "Waiting... attempt $i/30"

            sleep 2

          done

          echo ""
          echo "ERROR: Book API failed to start."
          echo ""

          docker logs bookapi

          exit 1


      # ======================================================
      # STEP 7 - RUN RESTASSURED AUTOMATION TESTS
      # ======================================================
      #
      # Maven Surefire runs the tests.
      #
      # It automatically creates reports under:
      #
      #     target/surefire-reports/
      #
      # ======================================================

      - name: Run RestAssured Automation Tests
        run: |

          echo "=========================================="
          echo "Running RestAssured Automation Tests"
          echo "=========================================="

          echo ""
          echo "Target API: ${BASE_URL}"
          echo ""

          mvn --batch-mode clean test \
            -Dbase.url="${BASE_URL}"


      # ======================================================
      # STEP 8 - UPLOAD AUTOMATION TEST REPORT
      # ======================================================
      #
      # This is the REPORT GENERATION/PRESERVATION part.
      #
      # Maven Surefire generated the results during:
      #
      #     mvn clean test
      #
      # We now upload those results to GitHub Actions.
      #
      # IMPORTANT:
      #
      # if: always()
      #
      # means this step runs even if some automation
      # tests fail.
      #
      # That is particularly important because when a test
      # fails, we want to see its report.
      #
      # ======================================================

      - name: Upload Automation Test Reports
        if: always()

        uses: actions/upload-artifact@v4

        with:

          name: automation-test-reports

          path: target/surefire-reports/

          if-no-files-found: warn

          retention-days: 30


      # ======================================================
      # STEP 9 - SHOW APPLICATION LOGS ON FAILURE
      # ======================================================

      - name: Show Book API Logs on Failure
        if: failure()

        run: |

          echo "=========================================="
          echo "Book API Logs"
          echo "=========================================="

          docker logs bookapi || true


      # ======================================================
      # STEP 10 - CLEAN UP
      # ======================================================
      #
      # Always stop and remove the Docker container.
      #
      # This runs whether tests pass or fail.
      #
      # ======================================================

      - name: Clean Up Docker
        if: always()

        run: |

          echo "=========================================="
          echo "Cleaning Up"
          echo "=========================================="

          docker stop bookapi || true

          docker rm bookapi || true

          echo "Cleanup complete."