name: Testbook API Automation Tests

# ============================================================
# WORKFLOW TRIGGERS
# ============================================================

on:

  # Run if automation code itself changes
  push:
    branches:
      - main

  # Allow manual execution
  workflow_dispatch:

  # Triggered by the Book API application repository
  repository_dispatch:
    types:
      - book-api-build-success


jobs:

  api-tests:

    name: Run API Automation Tests

    runs-on: ubuntu-latest

    env:
      BASE_URL: http://localhost:8080


    steps:

      # ======================================================
      # STEP 1 - CHECKOUT AUTOMATION REPOSITORY
      # ======================================================

      - name: Checkout Automation Repository
        uses: actions/checkout@v4


      # ======================================================
      # STEP 2 - INSTALL JAVA
      # ======================================================

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven


      # ======================================================
      # STEP 3 - CHECKOUT BOOK API APPLICATION
      # ======================================================

      - name: Checkout Book API
        uses: actions/checkout@v4
        with:
          repository: kscorpio77/testbookapiworkflowdemo
          ref: main
          path: book-api


      # ======================================================
      # STEP 4 - BUILD DOCKER IMAGE
      # ======================================================

      - name: Build Book API Docker Image
        run: |
          echo "=========================================="
          echo "Building Book API Docker Image"
          echo "=========================================="

          docker build \
            -t testbook-api:latest \
            ./book-api


      # ======================================================
      # STEP 5 - START APPLICATION
      # ======================================================

      - name: Start Book API
        run: |
          echo "=========================================="
          echo "Starting Book API"
          echo "=========================================="

          docker run -d \
            --name bookapi \
            -p 8080:8080 \
            testbook-api:latest


      # ======================================================
      # STEP 6 - WAIT FOR APPLICATION
      # ======================================================

      - name: Wait for Book API
        run: |

          echo "Waiting for Book API to become ready..."

          for i in {1..30}
          do

            if curl --fail --silent \
              http://localhost:8080/api/books \
              > /dev/null
            then

              echo ""
              echo "=========================================="
              echo "Book API is READY"
              echo "=========================================="

              exit 0

            fi

            echo "Waiting... attempt $i/30"

            sleep 2

          done

          echo ""
          echo "ERROR: Book API failed to start."

          docker logs bookapi

          exit 1


      # ======================================================
      # STEP 7 - RUN RESTASSURED AUTOMATION TESTS
      # ======================================================
      #
      # JUnit + Allure will generate:
      #
      # target/allure-results/
      #
      # Maven Surefire will also continue generating:
      #
      # target/surefire-reports/
      #
      # ======================================================

      - name: Run RestAssured Automation Tests
        run: |

          echo "=========================================="
          echo "Running RestAssured Automation Tests"
          echo "=========================================="

          echo ""
          echo "Target API: ${BASE_URL}"
          echo ""

          mvn --batch-mode clean test \
            -Dbase.url="${BASE_URL}"


      # ======================================================
      # STEP 8 - UPLOAD RAW SUREFIRE REPORTS
      # ======================================================
      #
      # Keep the original Maven reports as well.
      #
      # ======================================================

      - name: Upload Surefire Test Reports
        if: always()

        uses: actions/upload-artifact@v4

        with:
          name: surefire-test-reports
          path: target/surefire-reports/
          if-no-files-found: warn
          retention-days: 30


      # ======================================================
      # STEP 9 - INSTALL ALLURE COMMAND LINE
      # ======================================================
      #
      # Allure results are data files.
      #
      # The Allure command-line program converts those
      # results into a proper HTML website.
      #
      # ======================================================

      - name: Install Allure
        if: always()

        run: |

          echo "Installing Allure..."

          ALLURE_VERSION=2.29.0

          wget -q \
            "https://github.com/allure-framework/allure2/releases/download/${ALLURE_VERSION}/allure-${ALLURE_VERSION}.tgz"

          sudo tar -zxvf \
            "allure-${ALLURE_VERSION}.tgz" \
            -C /opt/

          sudo ln -sf \
            "/opt/allure-${ALLURE_VERSION}/bin/allure" \
            /usr/local/bin/allure

          echo ""
          echo "Installed Allure version:"

          allure --version


      # ======================================================
      # STEP 10 - GENERATE ALLURE HTML REPORT
      # ======================================================
      #
      # Input:
      #
      # target/allure-results
      #
      # Output:
      #
      # target/allure-report
      #
      # ======================================================

      - name: Generate Allure HTML Report
        if: always()

        run: |

          echo "=========================================="
          echo "Generating Allure HTML Report"
          echo "=========================================="

          if [ -d "target/allure-results" ] && \
             [ "$(ls -A target/allure-results 2>/dev/null)" ]
          then

            allure generate \
              target/allure-results \
              --clean \
              -o target/allure-report

            echo ""
            echo "Allure HTML report generated successfully."

          else

            echo ""
            echo "WARNING: No Allure results were generated."
            echo "Check the Allure configuration in pom.xml."

          fi


      # ======================================================
      # STEP 11 - UPLOAD ALLURE HTML REPORT
      # ======================================================
      #
      # This is the attractive HTML report.
      #
      # Download it from GitHub Actions -> Artifacts.
      #
      # ======================================================

      - name: Upload Allure HTML Report
        if: always()

        uses: actions/upload-artifact@v4

        with:
          name: allure-html-report
          path: target/allure-report/
          if-no-files-found: warn
          retention-days: 30


      # ======================================================
      # STEP 12 - UPLOAD RAW ALLURE RESULTS
      # ======================================================
      #
      # Useful for troubleshooting and future report history.
      #
      # ======================================================

      - name: Upload Allure Results
        if: always()

        uses: actions/upload-artifact@v4

        with:
          name: allure-results
          path: target/allure-results/
          if-no-files-found: warn
          retention-days: 30


      # ======================================================
      # STEP 13 - APPLICATION LOGS ON FAILURE
      # ======================================================

      - name: Show Book API Logs on Failure
        if: failure()

        run: |

          echo "=========================================="
          echo "BOOK API LOGS"
          echo "=========================================="

          docker logs bookapi || true


      # ======================================================
      # STEP 14 - CLEAN UP
      # ======================================================

      - name: Clean Up Docker
        if: always()

        run: |

          echo "=========================================="
          echo "Cleaning Up"
          echo "=========================================="

          docker stop bookapi || true
          docker rm bookapi || true

          echo ""
          echo "Cleanup completed."